default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", nil) %>
  username: <%= ENV.fetch("DB_USERNAME", nil) %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>

development:
  <<: *default
  database: simplifions_development

test:
  <<: *default
  database: simplifions_test

# En staging/sandbox/production, ce fichier est remplacé au déploiement par
# le template ansible (very_ansible, rails_config/simplifions/database.yml.j2).
production:
  primary: &primary_production
    <<: *default
    database: simplifions_production
    username: simplifions
    password: <%= ENV["SIMPLIFIONS_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: simplifions_production_cache
    migrations_paths: db/cache_migrate
