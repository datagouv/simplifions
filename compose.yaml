services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "(bundle check || bundle install) && bin/rails db:prepare && rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DATABASE_NAME_DEVELOPMENT: ${DATABASE_NAME_DEVELOPMENT:-simplifions_development}
      DATABASE_NAME_TEST: ${DATABASE_NAME_TEST:-simplifions_test}
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

  chrome: &browser
    image: selenium/standalone-chromium:4.51.0-20261010
    profiles: [verify]
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "/opt/bin/check-grid.sh"]
      interval: 2s
      timeout: 5s
      retries: 30

  firefox:
    <<: *browser
    image: selenium/standalone-firefox:4.51.0-20261010

volumes:
  db-data:
  bundle:
